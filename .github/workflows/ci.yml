name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
        env: { SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder }

  e2e:
    name: End-to-end, accessibility and evals (stubbed AI, $0)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,studio,postgres-meta,logflare,vector,supavisor,edge-runtime
      - name: Local env
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:55421" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$(npx supabase status -o json | jq -r .SERVICE_ROLE_KEY)" >> .env.local
          echo "SESSION_SECRET=ci-session-secret-0123456789abcdefghij" >> .env.local
          echo "TOKEN_ENCRYPTION_KEY=ci-token-key-0123456789abcdefghijklmn" >> .env.local
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
      - name: Serve for evals
        run: |
          npm run seed
          AI_STUB=1 EVAL_ENABLED=true EVAL_SECRET=e2e-eval npx next start -p 3300 &
          npx --yes wait-on@8.0.1 http://localhost:3300 --timeout 60000
      - name: Evals (in-house harness, mock judge)
        uses: conraddavisjr/ai-evals/.github/actions/run-evals@main
        continue-on-error: true
        env:
          FRONT_DESK_URL: http://localhost:3300
          EVAL_SECRET: e2e-eval
        with:
          config: evals/evals-cafe.config.json
          subset: all
          max-usd: "0"
